services:
  db:
    image: postgres:16
    container_name: dinecare-postgres
    restart: always
    environment:
      POSTGRES_DB: dinecare_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: dinecare-backend
    volumes:
      - ./backend:/app/backend
    working_dir: /app/backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    entrypoint: ["sh", "scripts/entrypoint.sh"]

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
